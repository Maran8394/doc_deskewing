[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-deskewing"
version = "1.0.0"
description = "Internal document deskewing library for reusable Python imports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "opencv-python-headless==4.13.0.92",
  "PyMuPDF==1.26.5",
  "scikit-image==0.25.2",
]

[project.optional-dependencies]
dev = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
